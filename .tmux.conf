# a key that doesn't hurt your wrist
set-option -g prefix C-j

# Otherwise there's like 200ms delay when hitting escape
set -s escape-time 0

# Use vim keys (hjkl) to scroll
setw -g mode-keys vi

# Use vim keys to select panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

#rebind prev/next
bind e previous-window
bind f next-window

# Quick way to go to last window
bind-key C-j last-window

# Start at 1 and simplify status
set -g base-index 1
set -g status-right ''

#aggressive resising
# turned off for the sake of iterm integratio
setw -g aggressive-resize off

# keybindings to make resizing easier
bind -r C-h resize-pane -L
bind -r C-j resize-pane -D
bind -r C-k resize-pane -U
bind -r C-l resize-pane -R

set-option -g default-terminal "screen-256color"
set-option -g xterm-keys on

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# mouse options
#set-option -g mouse-select-pane on

# mouse can be used to select windows (by clicking in the status bar)
#set-option -g mouse-select-window on

# mouse can be used to resize panes (by dragging dividers)
#set-option -g mouse-resize-pane on

set-option -g set-titles on
set-option -g set-titles-string '#H:#S.#I.#P #W #T' # window number,program name,active (or not)

set -g history-limit 4096

bind r source-file ~/.tmux.conf

# DESIGN TWEAKS

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour yellow

# copy mode
setw -g mode-style 'fg=black bg=magenta bold'

# panes
set -g pane-border-style 'fg=magenta'
set -g pane-active-border-style 'fg=yellow'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=red'

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=black bg=yellow'
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-style 'fg=black bg=magenta'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=magenta bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '

setw -g window-status-bell-style 'fg=yellow bg=magenta bold'

# messages
set -g message-style 'fg=yellow bg=magenta bold'

#set -g update-environment "SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION"
#bind-key p save-buffer ~/.tmux-buffer \; run-shell "source ~/bin/fixssh ; xsel -i -p <~/.tmux-buffer && xsel -i -b < ~/.tmux-buffer && rm ~/.tmux-buffer"

# Pass Shift+Enter (and other modified keys) through to apps like Claude Code.
# Without these, tmux strips the modifier and the app just sees a bare Enter.
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# Let apps know when the pane gains/loses focus (Claude Code warns without it).
set -g focus-events on
